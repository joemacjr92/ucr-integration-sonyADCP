name: Build and Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ] 
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} 

jobs:
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64 

  build-remote-asset:
    name: Build Remote Tarball Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Package Remote Asset
        run: |
          mkdir -p dist/sonyadcp
          # Copies core files, ignoring errors if no png exists
          cp -r src driver.json requirements.txt dist/sonyadcp/
          cp *.png dist/sonyadcp/ || true
          
          cd dist
          tar -czvf ucr-integration-sonyadcp.tar.gz sonyadcp/

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: remote-asset
          path: dist/ucr-integration-sonyadcp.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ucr-integration-sonyadcp.tar.gz
          generate_release_notes: true
